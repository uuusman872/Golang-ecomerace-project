services:
  postgres:
    image: postgres:16-alpine
    container_name: shop_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin1234}
      POSTGRES_DB: ${DB_NAME:-ecomerace_shop}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-root} -d ${DB_NAME:-ecomerace_shop}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: shop_migrate
    volumes:
      - ../db/migrations:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://${DB_USER:-root}:${DB_PASSWORD:-admin1234}@postgres:5432/${DB_NAME:-ecomerace_shop}?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: shop_api
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - ../.env
    environment:
      PORT: "8080"
      GIN_MODE: ${GIN_MODE:-debug}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin1234}
      DB_NAME: ${DB_NAME:-ecomerace_shop}
      DB_SSLMODE: disable
      AWS_S3_ENDPOINT: http://localstack:4566
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      UPLOAD_PATH: /root/uploads
    volumes:
      - ../uploads:/root/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped

  cdn:
    image: nginx:alpine
    container_name: shop_cdn
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../uploads:/var/www/uploads:ro
    depends_on:
      - localstack
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  localstack:
    image: localstack/localstack:latest
    container_name: localstack_container
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DATA_DIR=/tmp/localstack/data
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./init/aws/init-localstack.sh:/etc/localstack/init/ready.d/init.sh
    restart: unless-stopped

volumes:
  postgres_data: {}
  localstack_data: {}
  mailpit_data: {}
